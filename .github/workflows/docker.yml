name: Build image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [Dockerfile, requirements-app.txt, app/**, src/**, scripts/**]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/cm5git/hybrid-rag:latest