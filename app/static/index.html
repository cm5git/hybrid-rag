<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hybrid RAG demo</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 760px; margin: 2rem auto; padding: 0 1rem; color: #1a1a1a; line-height: 1.5; }
  h1 { margin-bottom: .2rem; }
  .sub { color: #555; margin-top: 0; }
  form { display: flex; gap: .5rem; margin: 1rem 0; }
  input { flex: 1; padding: .6rem; font-size: 1rem; border: 1px solid #aaa; border-radius: 6px; }
  button { padding: .6rem 1rem; font-size: 1rem; border: 0; border-radius: 6px; background: #1a56db; color: #fff; cursor: pointer; }
  button:disabled { background: #888; cursor: wait; }
  .badge { display: inline-block; padding: .1rem .6rem; border-radius: 99px; font-size: .85rem; font-weight: 600; }
  .answered { background: #d7f5dd; color: #14532d; }
  .declined, .uncited { background: #fde8c8; color: #7c3a00; }
  .retrieval_only { background: #e0e7ff; color: #1e3a8a; }
  .note { color: #555; font-size: .95rem; }
  .answer { background: #f6f8fa; border-radius: 8px; padding: 1rem; margin: .8rem 0; }
  .passage { border-left: 3px solid #ccc; padding: .1rem .8rem; margin: .8rem 0; }
  .passage.cited { border-left-color: #1a56db; background: #f3f7ff; }
  .passage h3 { margin: .2rem 0; font-size: 1rem; }
  .passage p { margin: .2rem 0; font-size: .9rem; color: #333; }
  a.cite { text-decoration: none; font-weight: 600; }
  .examples button { background: #eef; color: #223; font-size: .85rem; padding: .3rem .6rem; margin: 0 .3rem .3rem 0; }
</style>
</head>
<body>
<h1>Hybrid RAG over SciFact</h1>
<p class="sub">Ask a question or check a claim. Answers use only the retrieved research abstracts, cite them, and decline when the evidence is not there.</p>

<form id="form">
  <input id="q" placeholder="e.g. Does aspirin reduce the risk of colorectal cancer?" minlength="3" maxlength="500" required>
  <button id="go">Ask</button>
</form>
<div class="examples" id="examples"></div>
<div id="out"></div>

<script>
const examples = [
  "Does aspirin reduce the risk of colorectal cancer?",
  "Does vitamin D prevent fractures?",
  "Who won the 2018 FIFA World Cup?"
];
const form = document.getElementById("form"), q = document.getElementById("q"),
      go = document.getElementById("go"), out = document.getElementById("out");

for (const ex of examples) {
  const b = document.createElement("button");
  b.type = "button"; b.textContent = ex;
  b.onclick = () => { q.value = ex; q.focus(); };
}

const LABELS = {
  answered: "Answered with citations",
  declined: "Declined: not enough evidence in the passages",
  uncited: "Withheld: the model's answer had no valid citation",
  retrieval_only: "Passages only (no generated answer)"
};

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

// Turns "... [1][3]" into text with clickable citation links, without using innerHTML.
function withCitations(text) {
  const box = el("div", "answer");
  const parts = text.split(/(\[\d+\])/);
  for (const part of parts) {
    const m = part.match(/^\[(\d+)\]$/);
    if (m) {
      const a = el("a", "cite", part);
      a.href = "#p" + m[1];
      box.appendChild(a);
    } else {
      box.appendChild(document.createTextNode(part));
    }
  }
  return box;
}

function render(data) {
  out.replaceChildren();
  out.appendChild(el("span", "badge " + data.status, LABELS[data.status] || data.status));
  if (data.note) out.appendChild(el("p", "note", data.note));
  if (data.status === "answered") out.appendChild(withCitations(data.text));
  out.appendChild(el("h2", "", "Retrieved passages"));
  const cited = new Set(data.cited || []);
  for (const p of data.passages) {
    const div = el("div", "passage" + (cited.has(p.id) ? " cited" : ""));
    div.id = "p" + p.n;
    div.appendChild(el("h3", "", "[" + p.n + "] " + (p.title || "(untitled)")));
    div.appendChild(el("p", "", p.text.length > 600 ? p.text.slice(0, 600) + "…" : p.text));
    out.appendChild(div);
  }
}

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  go.disabled = true; out.replaceChildren(el("p", "note", "Searching and generating…"));
  try {
    const r = await fetch("/ask", {
      method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify({ question: q.value })
    });
    if (r.status === 429) { out.replaceChildren(el("p", "note", "Too many requests. Wait a minute and try again.")); return; }
    if (!r.ok) { out.replaceChildren(el("p", "note", "Something went wrong (" + r.status + ").")); return; }
    render(await r.json());
  } catch (err) {
    out.replaceChildren(el("p", "note", "Could not reach the server."));
  } finally {
    go.disabled = false;
  }
});
</script>
</body>
</html>
